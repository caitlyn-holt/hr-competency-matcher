# Порт сервера (Render передаёт переменную PORT)
server.port=${PORT:8080}

# --- БАЗА ДАННЫХ ---
# Если Render передаст INTERNAL_DATABASE_URL — используем его (добавляем jdbc: префикс)
# Иначе — локальная H2 база
spring.datasource.url=${INTERNAL_DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 консоль (только локально)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console