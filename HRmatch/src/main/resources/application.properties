server.port=${PORT:8080}

# База данных — ВСЕГДА берём из переменной DATABASE_URL с префиксом jdbc:
spring.datasource.url=jdbc:${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_URL:unused}.contains('postgresql') ? org.postgresql.Driver : org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true