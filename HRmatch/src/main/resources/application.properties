server.port=${PORT:8080}

# Отключаем авто-конфигурацию базы (мы настроим вручную в DatabaseConfig)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Переменные для базы (значения по умолчанию — для локальной H2)
DB_HOST=${DB_HOST:localhost}
DB_PORT=${DB_PORT:5432}
DB_NAME=${DB_NAME:testdb}
DB_USER=${DB_USER:sa}
DB_PASSWORD=${DB_PASSWORD:}
USE_POSTGRES=${USE_POSTGRES:false}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 консоль
spring.h2.console.enabled=true