# Порт сервера (Render передаёт переменную PORT, локально используется 8080)
server.port=${PORT:8080}

# База данных: если Render передаст переменные среды — подключится PostgreSQL.
# Если переменных нет (локальный запуск) — используется H2 в памяти.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate: update создаёт таблицы при первом запуске и обновляет их при изменениях
spring.jpa.hibernate.ddl-auto=update

# H2 консоль (доступна только при локальном запуске, в облаке не мешает)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console